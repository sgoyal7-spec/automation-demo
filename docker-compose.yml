services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "file:/app/data/demo.db"
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  caddy_data:
  caddy_config:
